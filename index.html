<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribuições do mês</title>
<meta name="description" content="Veja as contribuições de qualquer usuário do GitHub em um mês específico.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%239be9a8'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%2340c463'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%2330a14e'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23216e39'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#ffffff; --bg-inset:#f6f8fa; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --line-muted:#d1d9e0b3;
    --header:#f6f8fa; --accent:#0969da; --btn:#f6f8fa; --btn-hover:#eff2f5;
    --primary:#1f883d; --primary-hover:#1c8139; --danger:#d1242f; --focus:#0969da;
    --tip-bg:#25292e; --tip-fg:#ffffff; --cell-outline:#1f23280d;
    --l0:#eff2f5; --l1:#aceebb; --l2:#4ac26b; --l3:#2da44e; --l4:#116329;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --bg-inset:#010409; --fg:#f0f6fc; --muted:#9198a1; --line:#3d444d; --line-muted:#3d444db3;
      --header:#010409; --accent:#4493f8; --btn:#212830; --btn-hover:#262c36;
      --primary:#238636; --primary-hover:#29903b; --danger:#f85149; --focus:#1f6feb;
      --tip-bg:#3d444d; --tip-fg:#f0f6fc; --cell-outline:#ffffff0d;
      --l0:#151b23; --l1:#033a16; --l2:#196c2e; --l3:#2ea043; --l4:#56d364;
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* Header */
  header { background:var(--header); border-bottom:1px solid var(--line); }
  .header-inner { max-width:860px; margin:0 auto; padding:16px; display:flex; align-items:center; gap:12px; }
  .logo { display:grid; grid-template-columns:repeat(2, 10px); gap:3px; }
  .logo i { width:10px; height:10px; border-radius:2px; }
  .brand { font-weight:600; font-size:16px; }
  .brand small { font-weight:400; color:var(--muted); font-size:14px; margin-left:4px; }

  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:24px; }

  /* Form */
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .field { display:flex; align-items:center; flex:1 1 200px; min-width:0;
           border:1px solid var(--line); border-radius:6px; background:var(--bg); }
  .field:focus-within { outline:2px solid var(--focus); outline-offset:-1px; }
  .field svg { margin-left:10px; color:var(--muted); flex:none; }
  input { font:inherit; color:var(--fg); background:transparent; border:0; outline:0;
          padding:5px 12px; height:32px; min-width:0; }
  .field input { flex:1; padding-left:8px; }
  .month { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .month:focus-within { outline:2px solid var(--focus); outline-offset:-1px; }
  .month input { border-left:1px solid var(--line); border-right:1px solid var(--line); padding:5px 8px; }
  .btn { font:inherit; font-weight:500; height:32px; padding:0 12px; cursor:pointer; color:var(--fg);
         background:var(--btn); border:1px solid var(--line); border-radius:6px;
         display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--btn-hover); }
  .btn:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
  .month .btn { border:0; border-radius:0; padding:0 9px; color:var(--muted); }
  .btn-primary { background:var(--primary); border-color:#1f232826; color:#fff; }
  .btn-primary:hover { background:var(--primary-hover); }

  /* Profile */
  .profile { display:flex; align-items:center; gap:16px; }
  .avatar { width:64px; height:64px; border-radius:50%; border:1px solid var(--line-muted);
            background:var(--bg-inset); flex:none; }
  .profile h1 { margin:0; font-size:20px; font-weight:600; line-height:1.25; }
  .profile .login { color:var(--muted); font-size:16px; font-weight:300; }
  .profile .login:hover { color:var(--accent); }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); border:1px solid var(--line); border-radius:6px; }
  .stat { padding:12px 16px; border-left:1px solid var(--line); }
  .stat:first-child { border-left:0; }
  .stat b { display:block; font-size:24px; font-weight:600; line-height:1.25; }
  .stat span { color:var(--muted); font-size:12px; }
  @media (max-width:560px) {
    .stats { grid-template-columns:repeat(2, 1fr); }
    .stat:nth-child(3) { border-left:0; }
    .stat:nth-child(n+3) { border-top:1px solid var(--line); }
  }

  /* Calendar */
  .section-title { font-size:16px; font-weight:400; margin:0 0 8px; }
  .box { border:1px solid var(--line); border-radius:6px; padding:16px; }
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; max-width:420px; margin:0 auto; }
  .dow { font-size:12px; color:var(--muted); text-align:center; padding-bottom:2px; }
  .day { aspect-ratio:1; border-radius:4px; background:var(--l0); outline:1px solid var(--cell-outline);
         outline-offset:-1px; position:relative; font-size:11px; color:var(--muted);
         display:grid; place-items:center; cursor:default; }
  .day.l3, .day.l4 { color:#fff; }
  @media (prefers-color-scheme: dark) { .day.l2 { color:#fff; } .day.l4 { color:#0d1117; } }
  .day.future { opacity:.35; }
  .day.today { box-shadow:0 0 0 2px var(--accent); }
  .l1{background:var(--l1)} .l2{background:var(--l2)} .l3{background:var(--l3)} .l4{background:var(--l4)}
  .box-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
                margin-top:16px; font-size:12px; color:var(--muted); }
  .box-footer a { color:var(--muted); }
  .box-footer a:hover { color:var(--accent); }
  .legend { display:flex; align-items:center; gap:3px; }
  .legend i { width:10px; height:10px; border-radius:2px; outline:1px solid var(--cell-outline); outline-offset:-1px; }
  .legend .lbl { margin:0 4px; }

  /* Tooltip */
  .tip { position:fixed; z-index:10; pointer-events:none; background:var(--tip-bg); color:var(--tip-fg);
         font-size:12px; padding:5px 8px; border-radius:6px; white-space:nowrap;
         transform:translate(-50%, calc(-100% - 8px)); opacity:0; transition:opacity .1s; }
  .tip.show { opacity:1; }
  .tip::after { content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
                border:5px solid transparent; border-top-color:var(--tip-bg); }

  /* States */
  .blank { text-align:center; color:var(--muted); padding:48px 16px; border:1px solid var(--line); border-radius:6px; }
  .blank h2 { color:var(--fg); font-size:20px; margin:12px 0 4px; font-weight:600; }
  .flash { padding:16px; border:1px solid color-mix(in srgb, var(--danger) 40%, transparent);
           background:color-mix(in srgb, var(--danger) 10%, transparent); border-radius:6px; }
  .skeleton { background:var(--bg-inset); border-radius:6px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.5; } }

  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 32px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo" aria-hidden="true">
      <i style="background:var(--l1)"></i><i style="background:var(--l2)"></i>
      <i style="background:var(--l3)"></i><i style="background:var(--l4)"></i>
    </div>
    <span class="brand">Contribuições <small>do mês</small></span>
  </div>
</header>

<main>
  <form id="f">
    <label class="field">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
      <input id="user" type="text" placeholder="Usuário do GitHub" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-label="Usuário do GitHub">
    </label>
    <div class="month">
      <button type="button" class="btn" id="prev" aria-label="Mês anterior">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06Z"/></svg>
      </button>
      <input id="mes" type="month" required aria-label="Mês">
      <button type="button" class="btn" id="next" aria-label="Próximo mês">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
    </div>
    <button class="btn btn-primary">Ver contribuições</button>
  </form>

  <div id="out">
    <div class="blank">
      <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 1.75V13.5h13.75a.75.75 0 0 1 0 1.5H.75a.75.75 0 0 1-.75-.75V1.75a.75.75 0 0 1 1.5 0Zm14.28 2.53-5.25 5.25a.75.75 0 0 1-1.06 0L7 7.06 4.28 9.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.25-3.25a.75.75 0 0 1 1.06 0L10 7.94l4.72-4.72a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/></svg>
      <h2>Veja o mês de qualquer dev</h2>
      <p>Digite um usuário do GitHub e escolha o mês.</p>
    </div>
  </div>
</main>

<footer>
  Dados via <a href="https://github.com/grubersjoe/github-contributions-api">github-contributions-api</a>
</footer>

<div class="tip" id="tip" role="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hoje = new Date();
const hojeISO = `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}-${pad(hoje.getDate())}`;

const params = new URLSearchParams(location.search);
$('user').value = params.get('user') || '';
$('mes').value  = params.get('mes')  || hojeISO.slice(0, 7);

function submit() {
  const q = new URLSearchParams({ user: $('user').value.trim(), mes: $('mes').value });
  history.replaceState(null, '', '?' + q);
  load();
}

$('f').addEventListener('submit', e => { e.preventDefault(); submit(); });

function shiftMonth(delta) {
  const [a, m] = $('mes').value.split('-').map(Number);
  const d = new Date(a, m - 1 + delta, 1);
  $('mes').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  if ($('user').value.trim()) submit();
}
$('prev').addEventListener('click', () => shiftMonth(-1));
$('next').addEventListener('click', () => shiftMonth(1));

const plural = (n, um, varios) => `${n.toLocaleString('pt-BR')} ${n === 1 ? um : varios}`;

const cache = new Map();
function fetchYear(user, ano) {
  const key = `${user.toLowerCase()}:${ano}`;
  if (!cache.has(key)) {
    cache.set(key, fetch(`https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(user)}?y=${ano}`)
      .then(r => {
        if (!r.ok) throw new Error(r.status === 404
          ? `Não encontramos o usuário “${user}”.`
          : `A API de contribuições está indisponível no momento (${r.status}).`);
        return r.json();
      })
      .catch(err => { cache.delete(key); throw err; }));
  }
  return cache.get(key);
}

function skeleton() {
  return `<div class="profile"><div class="avatar skeleton"></div>
    <div style="flex:1"><div class="skeleton" style="height:20px;width:160px"></div>
    <div class="skeleton" style="height:16px;width:100px;margin-top:6px"></div></div></div>
    <div class="skeleton" style="height:74px;margin-top:24px"></div>
    <div class="skeleton" style="height:360px;margin-top:24px"></div>`;
}

async function load() {
  const user = $('user').value.trim(), mes = $('mes').value;
  if (!user || !mes) return;
  const [ano, m] = mes.split('-').map(Number);
  const out = $('out');
  out.innerHTML = skeleton();
  try {
    const data = await fetchYear(user, ano);
    if ($('user').value.trim() !== user || $('mes').value !== mes) return; // resposta obsoleta

    const dias = data.contributions.filter(d => d.date.startsWith(mes));
    const passados = dias.filter(d => d.date <= hojeISO);
    const total = dias.reduce((s, d) => s + d.count, 0);
    const ativos = dias.filter(d => d.count > 0).length;
    const melhor = dias.reduce((b, d) => d.count > b.count ? d : b, { count: 0 });
    let seq = 0, maior = 0;
    for (const d of dias) { seq = d.count > 0 ? seq + 1 : 0; maior = Math.max(maior, seq); }

    const nomeMes = new Date(ano, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const offset = new Date(ano, m - 1, 1).getDay();
    const fmtDia = iso => new Date(iso + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });

    let cal = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<div class="dow">${d}</div>`).join('');
    cal += '<div></div>'.repeat(offset);
    for (const d of dias) {
      const cls = [`l${d.level}`, d.date > hojeISO && 'future', d.date === hojeISO && 'today'].filter(Boolean).join(' ');
      const txt = d.count ? `${plural(d.count, 'contribuição', 'contribuições')} em ${fmtDia(d.date)}.`
                          : `Nenhuma contribuição em ${fmtDia(d.date)}.`;
      cal += `<div class="day ${cls}" data-tip="${esc(txt)}">${Number(d.date.slice(8))}</div>`;
    }

    const u = esc(user), url = `https://github.com/${encodeURIComponent(user)}`;
    out.innerHTML = `
      <div class="profile">
        <img class="avatar" src="${url}.png?size=128" alt="" width="64" height="64">
        <div>
          <h1 id="nome">${u}</h1>
          <a class="login" href="${url}" target="_blank" rel="noopener">@${u}</a>
        </div>
      </div>

      <div class="stats" style="margin-top:24px">
        <div class="stat"><b>${total.toLocaleString('pt-BR')}</b><span>contribuições</span></div>
        <div class="stat"><b>${ativos}<small style="font-size:14px;color:var(--muted);font-weight:400"> / ${passados.length || dias.length}</small></b><span>dias ativos</span></div>
        <div class="stat"><b>${maior}</b><span>maior sequência (dias)</span></div>
        <div class="stat"><b>${melhor.count}</b><span>${melhor.count ? 'melhor dia · ' + fmtDia(melhor.date) : 'melhor dia'}</span></div>
      </div>

      <div style="margin-top:24px">
        <h2 class="section-title">${plural(total, 'contribuição', 'contribuições')} em ${nomeMes}</h2>
        <div class="box">
          <div class="cal">${cal}</div>
          <div class="box-footer">
            <a href="https://docs.github.com/pt/account-and-profile/setting-up-and-managing-your-github-profile/managing-contribution-settings-on-your-profile/why-are-my-contributions-not-showing-up-on-my-profile" target="_blank" rel="noopener">Como contamos as contribuições?</a>
            <div class="legend"><span class="lbl">Menos</span>${[0,1,2,3,4].map(l => `<i class="l${l}"></i>`).join('')}<span class="lbl">Mais</span></div>
          </div>
        </div>
      </div>`;

    // Nome de exibição (opcional; ignora limite de taxa/erros)
    fetch(`https://api.github.com/users/${encodeURIComponent(user)}`)
      .then(r => r.ok ? r.json() : null)
      .then(p => { if (p?.name && $('nome')) $('nome').textContent = p.name; })
      .catch(() => {});
  } catch (err) {
    out.innerHTML = `<div class="flash">${esc(err.message)}</div>`;
  }
}

// Tooltip
const tip = $('tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) return tip.classList.remove('show');
  const r = el.getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  tip.style.left = r.left + r.width / 2 + 'px';
  tip.style.top = r.top + 'px';
  tip.classList.add('show');
});
window.addEventListener('scroll', () => tip.classList.remove('show'), { passive: true });

load();
</script>
</body>
</html>
