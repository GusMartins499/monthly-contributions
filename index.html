<!doctype html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Contributions</title>
<meta name="description" content="See any GitHub user's contributions for a specific month.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23aceebb'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%234ac26b'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%232da44e'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23116329'/%3E%3C/svg%3E">
<!-- GitHub Primer: design tokens (@primer/primitives) + components and utilities (@primer/css) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/primitives@11.9.0/dist/css/primitives.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/primitives@11.9.0/dist/css/functional/themes/light.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/primitives@11.9.0/dist/css/functional/themes/dark.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/css@22.3.2/dist/core.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/css@22.3.2/dist/product.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300..700&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before first paint to avoid a flash
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.colorMode = t; } catch {}
</script>
<style>
  /* Primer's system font stack starts with Mona Sans; load it from Google Fonts */
  body { font-family:"Mona Sans", var(--fontStack-system, sans-serif); background:var(--bgColor-default); }

  /* Theme toggle icon */
  .theme-toggle .sun { display:none; }
  :root[data-effective="dark"] .theme-toggle .sun { display:inline-block; }
  :root[data-effective="dark"] .theme-toggle .moon { display:none; }

  /* Contribution calendar — Primer has no component for it, so it is built from Primer tokens only */
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:var(--base-size-4); max-width:420px; margin:0 auto; }
  .day { aspect-ratio:1; display:grid; place-items:center; font-size:var(--text-body-size-small, 12px);
         border-radius:var(--borderRadius-medium, 6px);
         outline:1px solid var(--contribution-default-borderColor-0); outline-offset:-1px; }
  /* Day-number color per level, picked for WCAG AA contrast in each theme */
  :root { --day-fg-3:var(--fgColor-default); --day-fg-4:var(--fgColor-onEmphasis); }
  [data-color-mode="dark"] { --day-fg-3:var(--bgColor-default); --day-fg-4:var(--bgColor-default); }
  @media (prefers-color-scheme: dark) {
    [data-color-mode="auto"] { --day-fg-3:var(--bgColor-default); --day-fg-4:var(--bgColor-default); }
  }
  .lvl-0 { background:var(--contribution-default-bgColor-0); color:var(--fgColor-muted); }
  .lvl-1 { background:var(--contribution-default-bgColor-1); color:var(--fgColor-default); }
  .lvl-2 { background:var(--contribution-default-bgColor-2); color:var(--fgColor-default); }
  .lvl-3 { background:var(--contribution-default-bgColor-3); color:var(--day-fg-3); }
  .lvl-4 { background:var(--contribution-default-bgColor-4); color:var(--day-fg-4); }
  .day.future { background:transparent; color:var(--fgColor-muted); outline:1px dashed var(--borderColor-default); }
  .day.today { box-shadow:0 0 0 2px var(--borderColor-accent-emphasis); }
  .legend-cell { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle;
                 outline:1px solid var(--contribution-default-borderColor-0); outline-offset:-1px; }
  .logo { display:inline-grid; grid-template-columns:repeat(2, 10px); gap:3px; }
  .logo .legend-cell { outline:0; }

  /* Month picker: Primer only squares the outer ends of an input-group, so square the middle input too */
  .input-group .form-control:not(:first-child):not(:last-child) { border-radius:0; }
  /* The native month picker renders 2px taller than Primer's 32px controls */
  #month { height:32px; }
  /* Small screens: stack the form into full-width rows */
  @media (max-width: 543.98px) {
    #f > * { width:100% !important; margin-right:0 !important; }
  }

  /* Stat cards: a grid keeps every card the same size and flush with the content edges */
  .stats { display:grid; grid-template-columns:repeat(2, 1fr); grid-auto-rows:1fr; gap:var(--base-size-16); }
  @media (min-width: 768px) { .stats { grid-template-columns:repeat(4, 1fr); } }
</style>
</head>
<body>
<header class="Header">
  <div class="Header-item">
    <span class="logo mr-2" aria-hidden="true">
      <i class="legend-cell lvl-1"></i><i class="legend-cell lvl-2"></i><i class="legend-cell lvl-3"></i><i class="legend-cell lvl-4"></i>
    </span>
    <span class="f4 text-semibold">Contributions</span>
    <span class="ml-1 text-light">by month</span>
  </div>
  <div class="Header-item Header-item--full"></div>
  <div class="Header-item mr-0">
    <button type="button" class="Header-link btn-octicon theme-toggle" id="theme" aria-label="Toggle dark mode">
      <svg class="octicon moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"/></svg>
      <svg class="octicon sun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8Zm-8 5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm3.536-1.464a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-1.06-1.06a.75.75 0 0 1 0-1.06Z"/></svg>
    </button>
  </div>
</header>

<main class="container-md px-3 py-4">
  <form id="f" class="d-flex flex-wrap flex-items-center mb-4">
    <input id="user" class="form-control flex-auto mr-2 mb-2" type="text" placeholder="GitHub username"
           autocomplete="off" autocapitalize="off" spellcheck="false" required aria-label="GitHub username">
    <div class="input-group width-auto mr-2 mb-2">
      <span class="input-group-button">
        <button type="button" class="btn" id="prev" aria-label="Previous month">
          <svg class="octicon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06Z"/></svg>
        </button>
      </span>
      <input id="month" class="form-control" type="month" required aria-label="Month">
      <span class="input-group-button">
        <button type="button" class="btn" id="next" aria-label="Next month">
          <svg class="octicon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </span>
    </div>
    <button class="btn btn-primary mb-2">View contributions</button>
  </form>

  <div id="out">
    <div class="border rounded-2 py-6 px-3 text-center">
      <svg class="octicon color-fg-muted" width="32" height="32" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 1.75V13.5h13.75a.75.75 0 0 1 0 1.5H.75a.75.75 0 0 1-.75-.75V1.75a.75.75 0 0 1 1.5 0Zm14.28 2.53-5.25 5.25a.75.75 0 0 1-1.06 0L7 7.06 4.28 9.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.25-3.25a.75.75 0 0 1 1.06 0L10 7.94l4.72-4.72a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/></svg>
      <h2 class="h3 mt-3 mb-1">See any dev's month</h2>
      <p class="color-fg-muted mb-0">Enter a GitHub username and pick a month.</p>
    </div>
  </div>
</main>

<footer class="text-center f6 color-fg-muted pb-4">
  Data from <a class="color-fg-muted" href="https://github.com/grubersjoe/github-contributions-api">github-contributions-api</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const LOCALE = 'en-US';
const today = new Date();
const todayISO = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

// Theme (Primer data-color-mode: auto | light | dark)
const root = document.documentElement;
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const effectiveTheme = () => root.dataset.colorMode === 'auto' ? (darkQuery.matches ? 'dark' : 'light') : root.dataset.colorMode;
const syncTheme = () => { root.dataset.effective = effectiveTheme(); };
$('theme').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  root.dataset.colorMode = next;
  try { localStorage.setItem('theme', next); } catch {}
  syncTheme();
});
darkQuery.addEventListener('change', syncTheme);
syncTheme();

const params = new URLSearchParams(location.search);
$('user').value  = params.get('user')  || '';
$('month').value = params.get('month') || todayISO.slice(0, 7);

function submit() {
  const q = new URLSearchParams({ user: $('user').value.trim(), month: $('month').value });
  try { history.replaceState(null, '', '?' + q); } catch {}
  load();
}

$('f').addEventListener('submit', e => { e.preventDefault(); submit(); });

function shiftMonth(delta) {
  const [y, m] = $('month').value.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  $('month').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  if ($('user').value.trim()) submit();
}
$('prev').addEventListener('click', () => shiftMonth(-1));
$('next').addEventListener('click', () => shiftMonth(1));

const plural = (n, one, many) => `${n.toLocaleString(LOCALE)} ${n === 1 ? one : many}`;

const cache = new Map();
function fetchYear(user, year) {
  const key = `${user.toLowerCase()}:${year}`;
  if (!cache.has(key)) {
    cache.set(key, fetch(`https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(user)}?y=${year}`)
      .then(r => {
        if (!r.ok) throw new Error(r.status === 404
          ? `We couldn't find the user “${user}”.`
          : `The contributions API is unavailable right now (${r.status}).`);
        return r.json();
      })
      .catch(err => { cache.delete(key); throw err; }));
  }
  return cache.get(key);
}

const stat = (value, label) => `
  <div class="border rounded-2 px-3 py-2">
    <div class="f2 text-semibold lh-condensed">${value}</div>
    <div class="f6 color-fg-muted">${label}</div>
  </div>`;

function skeleton() {
  const block = (cls, style) => `<div class="color-bg-subtle rounded-2 anim-pulse ${cls}" style="${style}"></div>`;
  return `<div class="d-flex flex-items-center mb-4">${block('circle mr-3', 'width:64px;height:64px')}
      <div>${block('mb-2', 'width:160px;height:20px')}${block('', 'width:100px;height:16px')}</div></div>
    ${block('mb-4', 'height:70px')}${block('', 'height:360px')}`;
}

async function load() {
  const user = $('user').value.trim(), month = $('month').value;
  if (!user || !month) return;
  const [year, m] = month.split('-').map(Number);
  const out = $('out');
  out.innerHTML = skeleton();
  try {
    const data = await fetchYear(user, year);
    if ($('user').value.trim() !== user || $('month').value !== month) return; // stale response

    const days = data.contributions.filter(d => d.date.startsWith(month));
    const past = days.filter(d => d.date <= todayISO);
    const total = days.reduce((s, d) => s + d.count, 0);
    const active = days.filter(d => d.count > 0).length;
    const best = days.reduce((b, d) => d.count > b.count ? d : b, { count: 0 });
    let run = 0, longest = 0;
    for (const d of days) { run = d.count > 0 ? run + 1 : 0; longest = Math.max(longest, run); }

    const monthName = new Date(year, m - 1, 1).toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });
    const offset = new Date(year, m - 1, 1).getDay();
    const fmtDay = iso => new Date(iso + 'T12:00').toLocaleDateString(LOCALE, { month: 'long', day: 'numeric' });

    let cal = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="f6 color-fg-muted text-center">${d}</div>`).join('');
    cal += '<div></div>'.repeat(offset);
    for (const d of days) {
      const cls = [`lvl-${d.level}`, d.date > todayISO && 'future', d.date === todayISO && 'today'].filter(Boolean).join(' ');
      const label = d.count ? `${plural(d.count, 'contribution', 'contributions')} on ${fmtDay(d.date)}.`
                            : `No contributions on ${fmtDay(d.date)}.`;
      cal += `<div class="day tooltipped tooltipped-n ${cls}" role="img" aria-label="${esc(label)}">${Number(d.date.slice(8))}</div>`;
    }

    const u = esc(user), url = `https://github.com/${encodeURIComponent(user)}`;
    out.innerHTML = `
      <div class="d-flex flex-items-center mb-4">
        <img class="circle border mr-3" src="${url}.png?size=128" alt="" width="64" height="64">
        <div>
          <h1 class="h3 lh-condensed" id="name">${u}</h1>
          <a class="f4 text-light color-fg-muted" href="${url}" target="_blank" rel="noopener">@${u}</a>
        </div>
      </div>

      <div class="stats mb-4">
        ${stat(total.toLocaleString(LOCALE), 'contributions')}
        ${stat(`${active}<span class="f4 text-normal color-fg-muted"> / ${past.length || days.length}</span>`, 'active days')}
        ${stat(longest, 'longest streak (days)')}
        ${stat(best.count, best.count ? 'best day · ' + fmtDay(best.date) : 'best day')}
      </div>

      <h2 class="f4 text-normal mb-2">${plural(total, 'contribution', 'contributions')} in ${monthName}</h2>
      <div class="border rounded-2 p-3">
        <div class="cal">${cal}</div>
        <div class="d-flex flex-wrap flex-justify-between flex-items-center mt-3 f6 color-fg-muted">
          <a class="color-fg-muted" href="https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-github-profile/managing-contribution-settings-on-your-profile/why-are-my-contributions-not-showing-up-on-my-profile" target="_blank" rel="noopener">Learn how we count contributions</a>
          <div>
            <span class="mr-1">Less</span>${[0,1,2,3,4].map(l => `<i class="legend-cell lvl-${l}"></i>`).join(' ')}<span class="ml-1">More</span>
          </div>
        </div>
      </div>`;

    // Display name (optional; ignore rate limits/errors)
    fetch(`https://api.github.com/users/${encodeURIComponent(user)}`)
      .then(r => r.ok ? r.json() : null)
      .then(p => { if (p?.name && $('name')) $('name').textContent = p.name; })
      .catch(() => {});
  } catch (err) {
    out.innerHTML = `
      <div class="border color-border-danger color-bg-danger rounded-2 p-3 d-flex flex-items-center">
        <svg class="octicon color-fg-danger mr-2" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>
        <span>${esc(err.message)}</span>
      </div>`;
  }
}

load();
</script>
</body>
</html>
